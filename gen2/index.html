<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOUI-IST 2기 | Coming Soon</title>
  <meta name="description" content="MOUI-IST(모의스트) 2기 — 두 번째 모의를 준비 중입니다.">
  <meta property="og:title" content="MOUI-IST 2기 — Coming Soon">
  <meta property="og:description" content="두 번째 모의를 준비 중입니다.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://crew.mouiist.com/gen2/">
  <meta property="og:image" content="https://crew.mouiist.com/assets/mouiist.png">
  <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;700&family=Inter:wght@200;300;400;700;900&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #060606;
      --fg: #f0ece4;
      --accent: #c8a96e;
      --muted: rgba(240,236,228,0.45);
    }
    body {
      background: var(--bg); color: var(--fg);
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      overflow: hidden;
    }
    .bg-char {
      position: fixed; font-size: 40vw; font-weight: 900;
      color: rgba(200,169,110,0.04); user-select: none; pointer-events: none;
      font-family: 'Noto Sans KR', sans-serif; line-height: 1;
    }
    .bg-char.c1 { top: -5vw; left: -5vw; }
    .bg-char.c2 { bottom: -8vw; right: -5vw; }
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.35em;
      color: var(--accent); text-transform: uppercase;
      margin-bottom: 1.6rem;
      opacity: 0; animation: rise 1s ease 0.1s forwards;
    }
    h1 {
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      font-weight: 900; letter-spacing: 0.02em; line-height: 1.1;
      opacity: 0; animation: rise 1s ease 0.3s forwards;
    }
    h1 .dash { color: var(--accent); }
    .gen {
      font-size: clamp(1rem, 3vw, 1.5rem); font-weight: 300;
      letter-spacing: 0.5em; color: var(--muted);
      margin-top: 1rem;
      opacity: 0; animation: rise 1s ease 0.5s forwards;
    }
    .divider {
      width: 60px; height: 1px; background: var(--accent);
      margin: 2.4rem auto;
      opacity: 0; animation: rise 1s ease 0.7s forwards;
    }
    .desc {
      font-size: clamp(0.9rem, 2vw, 1.05rem); font-weight: 300;
      line-height: 2; color: var(--muted);
      opacity: 0; animation: rise 1s ease 0.9s forwards;
    }
    .desc em { font-style: normal; color: var(--accent); font-weight: 700; }
    .soon {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem; letter-spacing: 0.3em;
      color: var(--accent); margin-top: 2.4rem;
      animation: pulse 3s ease-in-out infinite;
      opacity: 0; animation: rise 1s ease 1.1s forwards, pulse 3s ease-in-out 2.1s infinite;
    }
    .back {
      position: fixed; top: 1.6rem; left: 1.8rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.15em;
      color: var(--muted); text-decoration: none;
      transition: color 0.3s;
    }
    .back:hover { color: var(--accent); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <span class="bg-char c1">謀</span>
  <span class="bg-char c2">議</span>
  <a class="back" href="/">&larr; MOUI-IST</a>
  <p class="eyebrow">Generation 2</p>
  <h1>MOUI<span class="dash">-</span>IST</h1>
  <p class="gen">2 기</p>
  <div class="divider"></div>
  <p class="desc">두 번째 <em>모의</em>를 준비하고 있습니다.<br>새로운 공모자들과 함께 곧 돌아옵니다.</p>
  <p class="soon">COMING SOON</p>
</body>
</html>
